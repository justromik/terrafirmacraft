plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'dev.justromik'
base { archivesName = 'tfc-horse-chests-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    version = '21.1.234'
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods { tfc_horse_chests { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes('Implementation-Version': project.version) } }

// Local jars are used only for development; they are never included in the addon jar.
dependencies { runtimeOnly fileTree(dir: 'dev-mods', include: ['*.jar']) }
if (providers.gradleProperty('gameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge.runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tfc_horse_chests'
        }
    }
}
